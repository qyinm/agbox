name: Rust CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test -p agbox-release-gate
      - run: cargo build --locked --release --target aarch64-apple-darwin -p agbox-cli
      - run: npm --prefix npm/cli run test:cutover
      - run: npm --prefix npm/cli pack --dry-run

name: Rust release gate

on:
  workflow_dispatch:
    inputs:
      profile:
        required: true
        default: ci-smoke
        type: choice
        options: [ci-smoke, release]

jobs:
  contract:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - run: cargo test -p agbox-release-gate
      - run: cargo build --locked --release --target aarch64-apple-darwin -p agbox-cli
      - name: Run candidate-bound gate
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          if [[ "$PROFILE" == "release" ]]; then DURATION=24h; else DURATION=10m; fi
          SHA="$(git rev-parse HEAD)"
          BINARY="target/aarch64-apple-darwin/release/agbox"
          cargo run --locked --release -p agbox-release-gate -- run \
            --profile "$PROFILE" --duration "$DURATION" --output release-gate-artifacts \
            --commit "$SHA" --target aarch64-apple-darwin --binary "$BINARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-release-gate-${{ inputs.profile }}
          path: release-gate-artifacts/
          if-no-files-found: error

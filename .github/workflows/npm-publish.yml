name: Publish npm package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish @agboxhq/cli
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Build pinned Rust artifact
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo build --locked --release --target aarch64-apple-darwin -p agbox-cli
          BINARY=target/aarch64-apple-darwin/release/agbox
          SHA="$(shasum -a 256 "$BINARY" | awk '{print $1}')"
          test "$SHA" = "$(node -p "require('./npm/cli/native.json').sha256")"
          gh release upload "${GITHUB_REF_NAME}" "$BINARY#agbox-darwin-arm64" --clobber

      - name: Verify npm package
        working-directory: npm/cli
        run: |
          npm run test:cutover
          npm pack --dry-run

      - name: Publish npm package
        working-directory: npm/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
